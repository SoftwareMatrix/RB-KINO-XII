<!doctype html>
<html lang="en">
  <!-- Document Head Start -->

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pages.css" />
    <title>Sessions · KINO XII</title>
  </head>

  <!-- Document Head End -->

  <body class="inner-page">
    <!-- Header Start -->

    <header class="site-header">
      <a class="header-logo" href="index.html" aria-label="Kino XII home">
        KINO <span>XII</span>
      </a>

      <nav aria-label="Main navigation">
        <a href="sessions.html">Sessions</a>
      </nav>

      <form
        class="header-search"
        action="sessions.html"
        method="get"
        role="search"
      >
        <label class="visually-hidden" for="sessions-search">
          Search films and live events
        </label>

        <img class="search-icon" src="assets/icons/search.svg" alt="" />

        <input
          id="sessions-search"
          name="search"
          type="search"
          placeholder="Search films and live events"
        />
      </form>

      <div class="header-auth">
        <a class="signup-button page-auth-link" href="signup.html"> Sign up </a>

        <a class="login-button page-auth-link" href="authorization.html">
          Log in
        </a>
      </div>
    </header>

    <!-- Header End -->

    <!-- Sessions Page Start -->

    <main class="page-shell sessions-page">
      <h1 class="page-title">Sessions</h1>
      <p class="page-subtitle">Browse showtimes across all venues</p>

      <!-- Sessions Layout Start -->

      <div class="sessions-layout">
        <!-- Filters Start -->

        <aside class="filters-panel">
          <h2>Filters</h2>

          <fieldset>
            <legend>Venue</legend>
          </fieldset>

          <fieldset>
            <legend>Date</legend>
            <div class="filter-days"></div>
          </fieldset>

          <fieldset>
            <legend>Format</legend>
          </fieldset>

          <fieldset>
            <legend>Language</legend>
          </fieldset>

          <fieldset>
            <legend>Time of day</legend>
          </fieldset>

          <p class="active-filter-count">0 filters active</p>

          <button class="clear-filters" type="button">Clear All Filters</button>
        </aside>

        <!-- Filters End -->

        <!-- Sessions Results Start -->

        <section class="sessions-results" aria-labelledby="results-title">
          <div class="results-toolbar">
            <h2 id="results-title">Loading sessions</h2>

            <label>
              Sort:
              <select name="sort"></select>
            </label>
          </div>

          <nav class="pagination" aria-label="Sessions pages"></nav>
        </section>

        <!-- Sessions Results End -->
      </div>

      <!-- Sessions Layout End -->
    </main>

    <!-- Sessions Page End -->

    <!-- Footer Start -->

    <footer class="site-footer">
      <div class="footer-divider" aria-hidden="true"></div>

      <div class="footer-content">
        <a href="index.html"> KINO <span>XII</span> </a>

        <p>© 2026 Kino XII. All rights reserved.</p>
      </div>
    </footer>

    <!-- Footer End -->

    <!-- Scripts Start -->

    <script src="api.js"></script>
    <script src="script.js"></script>

    <!-- Scripts End -->
  </body>
</html>
