<!doctype html>

<!-- Authentication Page Start -->

<html lang="en">
  <!-- Document Head Start -->

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pages.css" />

    <title>Log in · KINO XII</title>
  </head>

  <!-- Document Head End -->

  <body class="auth-page">
    <!-- Page Background Start -->

    <iframe
      class="auth-background"
      src="index.html"
      title=""
      tabindex="-1"
      aria-hidden="true"
    ></iframe>

    <!-- Page Background End -->

    <!-- Authentication Modal Start -->

    <main class="modal-layer">
      <section
        class="auth-card login-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="login-title"
      >
        <a class="modal-close" href="index.html" aria-label="Close">
          <img src="assets/icons/close.svg" alt="" />
        </a>

        <h1 id="login-title">Log in</h1>
        <p class="auth-intro">Welcome back to Kino XII</p>

        <!-- Login Form Start -->

        <form class="auth-form">
          <div class="form-field" data-validation="email">
            <label for="login-email">Email</label>

            <span class="input-shell">
              <input
                id="login-email"
                name="email"
                type="email"
                placeholder="example@gmail.com"
                autocomplete="email"
                required
              />

              <i class="field-status" aria-hidden="true"></i>
            </span>

            <small class="field-message"> Enter a valid email address. </small>
          </div>

          <div class="form-field" data-validation="password">
            <label for="login-password">Password</label>

            <span class="input-shell">
              <input
                id="login-password"
                name="password"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
                minlength="3"
                required
              />

              <i class="field-status" aria-hidden="true"></i>
            </span>

            <small class="field-message"> At least 3 characters. </small>
          </div>

          <button class="auth-submit" type="submit" disabled>Log in</button>
        </form>

        <!-- Login Form End -->

        <p class="auth-switch">
          Don't have an account?
          <a href="signup.html">Sign up</a>
        </p>
      </section>
    </main>

    <!-- Authentication Modal End -->

    <!-- Scripts Start -->

    <script src="api.js"></script>
    <script src="script.js"></script>

    <!-- Scripts End -->
  </body>
</html>

<!-- Authentication Page End -->
